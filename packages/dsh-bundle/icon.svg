<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BUA">
  <!--
    BUA 的图标：浏览器窗口的边缘泛光。
    与扩展运行时注入页面四周的光晕是同一套视觉语言，因此用户在插件列表里
    认得出「就是那个会在页面上发光的东西」。
    原创绘制，无第三方素材。
  -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色底 -->
  <rect width="64" height="64" rx="13" fill="#0f172a"/>

  <!-- 窗口外框 + 泛光 -->
  <g filter="url(#bloom)">
    <rect x="10" y="13" width="44" height="38" rx="6.5"
          fill="none" stroke="url(#edge)" stroke-width="3.2"/>
  </g>

  <!-- 顶部标题栏，暗示这是一个浏览器窗口 -->
  <line x1="10" y1="23" x2="54" y2="23" stroke="url(#edge)" stroke-width="2" opacity="0.55"/>
  <circle cx="16.5" cy="18" r="1.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="22" cy="18" r="1.5" fill="#60a5fa" opacity="0.5"/>

  <!-- 中心的光点：被操作的内容 -->
  <circle cx="32" cy="38" r="3.4" fill="#93c5fd" opacity="0.95"/>
</svg>
