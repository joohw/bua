<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUA — 操作日志</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="website.css">
  <style>
    .brand { display: flex; justify-content: space-between; gap: 20px; }
    .brand a { font-size: 14px; }
    h1 { margin-bottom: 16px; }
    .intro { font-size: 14px; }
    label { display: block; margin: 32px 0 8px; font-size: 14px; }
    button:focus-visible, [role="option"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .picker { position: relative; min-width: 0; }
    #page { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; border-color: hsl(30 9% 82%); color: var(--fg); font-size: 14px; text-align: left; }
    #page::after { content: '⌄'; margin-left: auto; flex: none; color: var(--dim); }
    .favicon { position: relative; display: grid; place-items: center; width: 18px; height: 18px; flex: none; color: var(--dim); font-size: 18px; line-height: 1; }
    .favicon img { position: absolute; inset: 0; width: 18px; height: 18px; object-fit: contain; background: var(--bg); }
    .page-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pages { position: absolute; top: calc(100% + 6px); left: 0; width: 100%; max-height: min(360px, 50vh); overflow-y: auto; padding: 5px; border: 1px solid hsl(30 9% 82%); border-radius: 8px; background: var(--bg); box-shadow: 0 8px 24px #28201818; z-index: 10; }
    #pages [role="option"] { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 0; color: var(--fg); text-align: left; font-size: 14px; }
    #pages [aria-selected="true"] { background: hsl(8 52% 94%); color: var(--accent); }
    #pages [role="option"]:hover { background: hsl(30 12% 93%); }
    #updates { margin: 16px 0; }
    button { padding: 8px 14px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent); background: transparent; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { background: hsl(8 52% 96%); }
    #log { padding: 0; margin: 32px 0 0; list-style: none; }
    #log li { padding: 18px 0; margin: 0; border-top: 1px solid hsl(30 9% 86%); }
    #log li:first-child { border-top: 0; }
    .entry-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
    time { color: var(--dim); font-size: 12px; }
    .method { font-size: 13px; }
    .result { margin-left: auto; font-size: 12px; color: hsl(145 35% 32%); }
    .result.fail { color: var(--accent); }
    .detail { margin: 6px 0 0; font-size: 13px; overflow-wrap: anywhere; }
    #state { padding: 28px 0; color: var(--dim); font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="content">
    <header class="brand"><a href="onboarding.html">返回设置</a></header>
    <h1>操作日志</h1>
    <p class="intro">按标签页和当前地址查看操作记录，向下滚动自动加载更多。</p>
    <label id="pageLabel" for="page">查看页面</label>
    <div class="picker" id="picker">
      <button id="page" aria-haspopup="listbox" aria-expanded="false" aria-controls="pages" disabled>正在读取标签页…</button>
      <div id="pages" role="listbox" aria-labelledby="pageLabel" hidden></div>
    </div>
    <button id="updates" hidden>有新记录，点击刷新</button>
    <ul id="log"></ul>
    <div id="state" role="status" aria-live="polite">正在加载…</div>
    <button id="retry" hidden>重试加载</button>
  </main>
  <script src="logs.js"></script>
</body>
</html>
