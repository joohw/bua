<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUA — Browser Use Agent</title>
<meta name="description" content="让任意 Agent 操作用户真实浏览器的通用能力层。Chrome MV3 扩展 + 本地桥 + SDK。">
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --fg:#e2e8f0; --dim:#94a3b8; --accent:#60a5fa; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f8fafc; --panel:#fff; --line:#e2e8f0; --fg:#1e293b; --dim:#64748b; --accent:#2563eb; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.7 ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
  }
  .card {
    max-width: 620px; margin: 32px; padding: 40px; 
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    box-shadow: 0 0 10px rgba(59,130,246,.8);
  }
  .brand b { font-size: 16px; }
  h1 { font-size: 25px; line-height: 1.35; margin: 0 0 14px; letter-spacing: -.01em; }
  p { margin: 0 0 14px; color: var(--dim); }
  .links { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn {
    display: inline-block; padding: 9px 16px; border-radius: 9px; text-decoration: none;
    border: 1px solid var(--line); color: var(--fg); font-size: 14px; font-weight: 500;
    transition: border-color .15s;
  }
  a.btn:hover { border-color: var(--accent); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fine { margin-top: 24px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><b>BUA — Browser Use Agent</b></div>

    <h1>让任意 Agent 操作用户真实浏览器</h1>
    <p>
      Chrome MV3 扩展 + 本地桥 + SDK。用真实标签页与真实登录态，
      不需要重启浏览器，也不开放 CDP 调试端口。
    </p>
    <p>
      不校验调用方身份、不签发凭据 —— 这是刻意取舍，风险由引导页如实告知。
    </p>

    <div class="links">
      <a class="btn primary" href="privacy.html">隐私政策</a>
      <a class="btn" href="https://github.com/joohw/bua">源码（MIT）</a>
      <a class="btn" href="https://github.com/joohw/bua/tree/main/docs">设计文档</a>
    </div>

    <div class="fine">
      BUA 不收集、不存储、不上传任何数据。扩展包内没有任何网络请求代码。
    </div>
  </div>
</body>
</html>
